name: Android Widget AQI offline checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile pure Java AQI rules against Java 8 API
        run: |
          mkdir -p /tmp/aqi-java
          javac --release 8 -d /tmp/aqi-java \
            app/src/main/java/com/example/goldaj/firstapp/AirQualityRules.java \
            app/src/main/java/com/example/goldaj/firstapp/AirQualityData.java \
            tests/AirQualityRulesTest.java
          java -cp /tmp/aqi-java com.example.goldaj.firstapp.AirQualityRulesTest
      - name: Validate Android XML and refresh UI contract
        run: python -m unittest discover -s tests -p 'test_*.py' -v
