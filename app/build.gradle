// Private configuration stays outside the repository.
def privateRoot = System.getenv('CODEX_PRIVATE_PROJECT_CONFIG') ?: new File(System.getProperty('user.home'), 'Documents/Codex-Private').absolutePath
def localSecrets = new Properties()
def localSecretsFile = new File(privateRoot, 'android-widget-lab/secrets.properties')
if (localSecretsFile.exists()) {
    localSecretsFile.withInputStream { localSecrets.load(it) }
}
def waqiTokenLiteral = groovy.json.JsonOutput.toJson(localSecrets.getProperty('WAQI_API_TOKEN', ''))

apply plugin: 'com.android.application'

android {
    compileSdkVersion 25
    buildToolsVersion "25.0.2"
    defaultConfig {
        buildConfigField "String", "WAQI_API_TOKEN", waqiTokenLiteral
        applicationId "com.example.goldaj.firstapp"
        minSdkVersion 15
        targetSdkVersion 25
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    androidTestCompile('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    compile 'com.android.support:appcompat-v7:25.2.0'
    testCompile 'junit:junit:4.12'
}
